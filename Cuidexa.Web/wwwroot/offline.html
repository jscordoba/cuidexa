<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Cuidexa</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #101a30;
            text-align: center;
            padding: 24px;
        }
        .tarjeta { max-width: 360px; }
        .icono {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #fff;
            font-size: 28px;
        }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: #6c757d; margin: 0 0 20px; }
        button {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #3730a3; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="icono">&#9729;</div>
        <h1>Sin conexión</h1>
        <p>Esta pantalla necesita conexión a internet y no se pudo cargar. Comprueba tu red e inténtalo de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
