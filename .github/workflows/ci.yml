name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Cuidexa.Web/Cuidexa.Web.csproj

      - name: Compilar
        run: dotnet build Cuidexa.Web/Cuidexa.Web.csproj --no-restore --configuration Release
